<!DOCTYPE html>
<html lang="pt-pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aires Almeida's CV</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Fundo fixo igual à janela principal */
        body { 
            margin: 0;
            padding: 0;
            position: relative;
            color: white;
        }

        body::before {
            content: "";
            background-image: url('https://img.freepik.com/vetores-gratis/plano-de-fundo-da-area-de-trabalho-moderno-vetor-de-desenho-geometrico-azul_53876-135923.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            opacity: 0.8; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
        }

        /* Estilo das Seções (Efeito Vidro) */
        section { 
            padding: 80px 0; 
            min-height: auto; 
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* Navbar personalizada */
        .navbar { 
            background: rgba(0, 0, 0, 0.9) !important;
            border-bottom: 2px solid #e67e22; 
        }

        .nav-link:hover {
            color: #e67e22 !important;
        }

        /* Foto de Perfil */
        .profile-img { 
            width: 180px; 
            height: 180px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 4px solid #e67e22;
        }

        /* Botões e Badges */
        .btn-custom {
            background-color: #e67e22;
            color: white;
            border-radius: 25px;
            padding: 10px 25px;
            transition: 0.3s;
            border: none;
        }

        .btn-custom:hover {
            background-color: #d35400;
            color: white;
            transform: translateY(-2px);
        }

        .badge-skill {
            background-color: rgba(230, 126, 34, 0.2);
            border: 1px solid #e67e22;
            color: #e67e22;
            padding: 8px 15px;
            margin: 5px;
        }

        h2, h3 { color: #e67e22; }

        @media (max-width: 768px) {
            section { padding: 60px 0; }
            .glass-card { padding: 20px; }
            .navbar-brand { font-size: 1.2rem; }
            
        }
        
    </style>

</head>

<body data-bs-spy="scroll" data-bs-target="#nav-principal">

                    <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>

        </div>

    <section id="home" class="d-flex align-items-center">
